<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>studiolegalepedone.it</title>
<meta name="description" content="Il sito è in fase di aggiornamento.">
<meta name="robots" content="noindex">
<style>
  :root{
    --ink: #14161c;
    --ink-2: #1c1f27;
    --parchment: #ece3d0;
    --parchment-dim: #a89d84;
    --seal: #7a1f2b;
    --seal-dark: #5a141d;
    --gold: #a9834f;
    --gold-soft: rgba(169,131,79,0.35);
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
  }

  body{
    background: var(--ink);
    color: var(--parchment);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* texture di fondo: grana carta sottilissima */
  .grain{
    position: fixed;
    inset: 0;
    opacity: 0.05;
    pointer-events: none;
    mix-blend-mode: overlay;
  }

  .vignette{
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
  }

  main{
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 32px;
    opacity: 0;
    animation: rise 1.1s ease-out 0.15s forwards;
  }

  /* --- Sigillo --- */
  .seal-wrap{
    width: 108px;
    height: 108px;
    margin-bottom: 34px;
    opacity: 0;
    transform: scale(0.8);
    animation: stamp 0.9s cubic-bezier(.2,1.4,.4,1) 0.05s forwards;
  }

  .seal{
    width: 100%;
    height: 100%;
    border-radius: 50%;
    position: relative;
    background:
      radial-gradient(circle at 34% 30%, #9c3140 0%, var(--seal) 45%, var(--seal-dark) 100%);
    box-shadow:
      0 10px 24px rgba(0,0,0,0.55),
      inset 0 2px 3px rgba(255,255,255,0.15),
      inset 0 -6px 10px rgba(0,0,0,0.45);
  }

  .seal::before{
    content:"";
    position: absolute;
    inset: 9px;
    border-radius: 50%;
    border: 1px solid rgba(236,227,208,0.28);
  }

  .seal-mono{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Iowan Old Style', Georgia, serif;
    font-size: 30px;
    letter-spacing: 1px;
    color: rgba(236,227,208,0.92);
    text-shadow: 0 1px 1px rgba(0,0,0,0.4);
    transform: rotate(-2deg);
  }

  /* --- Testo --- */
  h1{
    margin: 0;
    font-weight: 400;
    font-size: clamp(22px, 4vw, 32px);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--parchment);
    line-height: 1.5;
  }

  .rule{
    width: 64px;
    height: 1px;
    margin: 22px 0;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    position: relative;
    overflow: hidden;
  }

  .rule::after{
    content:"";
    position: absolute;
    top:0; left:-100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.9), transparent);
    animation: shimmer 4.5s ease-in-out infinite;
  }

  p.status{
    margin: 0;
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--parchment-dim);
  }

  footer{
    position: fixed;
    bottom: 26px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: rgba(168,157,132,0.45);
    z-index: 1;
  }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(14px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  @keyframes stamp{
    0%{ opacity: 0; transform: scale(0.8); }
    60%{ opacity: 1; transform: scale(1.06); }
    100%{ opacity: 1; transform: scale(1); }
  }

  @keyframes shimmer{
    0%, 85%, 100%{ left: -100%; }
    92%{ left: 100%; }
  }

  @media (prefers-reduced-motion: reduce){
    main, .seal-wrap{ animation: none; opacity: 1; transform: none; }
    .rule::after{ animation: none; }
  }
</style>
</head>
<body>

  <svg class="grain" xmlns="http://www.w3.org/2000/svg">
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"></feTurbulence>
      <feColorMatrix type="saturate" values="0"></feColorMatrix>
    </filter>
    <rect width="100%" height="100%" filter="url(#noise)"></rect>
  </svg>
  <div class="vignette"></div>

  <main>
    <div class="seal-wrap">
      <div class="seal">
        <div class="seal-mono">SP</div>
      </div>
    </div>

    <h1>Studio&nbsp;Legale<br>Pedone</h1>
    <div class="rule"></div>
    <p class="status">Sito in aggiornamento</p>
  </main>

  <footer>studiolegalepedone.it</footer>

</body>
</html>
